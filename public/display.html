<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WordSalad Live — Display</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{ height: calc(var(--vh) * 100); overflow:hidden; display:flex; flex-direction:column; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 26px 6px; flex:none; }
  .brand{ font-size:20px; font-weight:600; }
  .brand em{ font-style:normal; color:var(--citrus); }

  .layout{ flex:1; display:flex; gap:18px; padding:6px 26px 22px; min-height:0; }
  .stage{ flex:1.7; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .side{ flex:1; max-width:360px; display:flex; flex-direction:column; gap:14px; min-height:0; }

  .theme-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .theme-label{ font-size:12px; color:var(--ink-faint); }
  .theme-title{ font-size:clamp(22px, 3vw, 34px); font-weight:600; color:var(--citrus); line-height:1.1; }
  .progress-info{ display:flex; align-items:center; gap:14px; }
  .progress-dots{ display:flex; gap:6px; }
  .progress-dot{ width:11px; height:11px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); }
  .progress-dot.done{ background:var(--leaf); border-color:var(--leaf); }
  .timer{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--ink); min-width:44px; text-align:right; }
  .timer.low{ color:var(--berry); }
  .combo-badge{
    font-size:13px; font-weight:800; color:var(--citrus); background:rgba(255,184,77,0.14);
    border:1px solid var(--citrus); border-radius:999px; padding:3px 10px;
    opacity:0; transform:scale(.85); transition:opacity .25s ease, transform .25s ease;
  }
  .combo-badge.show{ opacity:1; transform:scale(1); }

  .grid-wrap{ position:relative; width:min(100%, 62vh); margin:0 auto; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .grid-square{ position:relative; width:100%; aspect-ratio:1/1; max-height:100%; }
  .grid{ position:absolute; inset:0; display:grid; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:10px; }
  .cell{ font-size:clamp(11px, 2.6vw, 22px); border-radius:8px; }

  .answers{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .instructions{ text-align:center; color:var(--ink-faint); font-size:14px; margin-top:12px; }
  .instructions b{ color:var(--sky); font-weight:700; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px; display:flex; flex-direction:column; min-height:0; }
  .panel h2{ font-size:13px; margin:0 0 8px; color:var(--ink-dim); font-weight:700; }
  .leaderboard{ flex:1; overflow:hidden; }
  .feed-panel{ flex:2; overflow-y:auto; }

  @media (max-width: 800px){
    .layout{ flex-direction:column; }
    .side{ max-width:none; flex-direction:row; }
    .panel{ flex:1; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Word<em>Salad</em> Live</div>
    <button class="pill" id="enableSoundBtn" style="border:none; cursor:pointer;">🔈 Tap for sound</button>
    <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </div>

  <div class="layout">
    <div class="stage">
      <div class="theme-row">
        <div>
          <div class="theme-label">Today's theme</div>
          <div class="theme-title display-font" id="themeTitle">— waiting for host —</div>
        </div>
        <div class="progress-info">
          <div class="progress-dots" id="progressDots"></div>
          <div class="combo-badge" id="comboBadge"></div>
          <div class="timer" id="timerNum">--</div>
        </div>
      </div>

      <div class="grid-wrap">
        <div class="grid-square" id="gridSquare">
          <div class="grid" id="grid"></div>
        </div>
      </div>

      <div class="answers" id="answers"></div>
      <div class="instructions">Type your guess in the <b>TikTok LIVE comments</b> to find a word!</div>
    </div>

    <div class="side">
      <div class="panel leaderboard">
        <h2>Top 10</h2>
        <div id="leaderboard"><div class="empty-hint">No scores yet — be the first!</div></div>
      </div>
      <div class="panel feed-panel">
        <h2>Live comments</h2>
        <div class="feed-scroll" id="feed" style="display:flex; flex-direction:column-reverse; gap:7px;"></div>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game-render.js"></script>
<script src="/audio.js"></script>
<script>
  function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
  setVH();

  const socket = io();
  const R = WordSaladRender;

  let soundOn = false;
  const enableSoundBtn = document.getElementById('enableSoundBtn');
  enableSoundBtn.onclick = () => {
    WordSaladAudio.unlock();
    soundOn = true;
    enableSoundBtn.style.display = 'none';
  };

  let comboBadgeTimeout = null;
  socket.on('wordFound', (info) => {
    if (soundOn) WordSaladAudio.playFind(info.comboCount);
    if (info.multiplier > 1) {
      if (soundOn) WordSaladAudio.playCombo();
      const badge = document.getElementById('comboBadge');
      badge.textContent = '🔥 x' + info.multiplier;
      badge.classList.add('show');
      clearTimeout(comboBadgeTimeout);
      comboBadgeTimeout = setTimeout(() => badge.classList.remove('show'), 2200);
    }
  });

  socket.on('puzzleComplete', (info) => {
    if (info.cleared) {
      R.celebrate(document.getElementById('gridSquare'));
      if (soundOn) WordSaladAudio.playComplete();
    }
  });

  socket.on('state', (s) => {
    const dot = document.getElementById('statusDot');
    dot.className = 'dot ' + (s.connection.mode === 'live' ? 'live' : s.connection.mode === 'test' ? 'test' : '');
    document.getElementById('statusText').textContent =
      s.connection.mode === 'live' ? 'LIVE — reading @' + s.connection.tiktokUsername :
      s.connection.mode === 'test' ? 'Test Mode' : 'Waiting to connect';

    document.getElementById('themeTitle').textContent = s.game.theme || '— waiting for host —';

    if (s.game.grid) {
      R.resetTrackingIfNewPuzzle(s.game.theme);
      R.renderGrid(document.getElementById('grid'), s.game.gridSize, s.game.grid, s.game.words, s.game.clearedGrid);
      R.renderAnswers(document.getElementById('answers'), s.game.words);
      R.renderProgress(document.getElementById('progressDots'), s.game.wordsFound, s.game.wordsTotal);
    }

    const timerEl = document.getElementById('timerNum');
    timerEl.textContent = s.game.status === 'playing' ? s.game.timeLeft + 's' : '--';
    timerEl.classList.toggle('low', s.game.status === 'playing' && s.game.timeLeft <= 10);

    R.renderLeaderboard(document.getElementById('leaderboard'), s.leaderboard, 'No scores yet — be the first!');
    R.renderFeed(document.getElementById('feed'), s.feed, 25);
  });
</script>
</body>
</html>
