<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WordSalad Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14101f; --panel:#1f1830cc; --panel2:#261d3bcc; --line:#372a54;
    --ink:#f3effa; --ink-dim:#b6acce;
    --yellow:#ffd23f; --mint:#37e2c4; --pink:#ff5c7a;
    --vh: 1vh;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    height: calc(var(--vh) * 100);
    background:radial-gradient(circle at 20% 0%, #241a3c 0%, var(--bg) 55%);
    color:var(--ink); font-family:'Inter',sans-serif; overflow:hidden;
    display:flex; flex-direction:column;
  }
  h1,.tile,.word-display,.timer-num{ font-family:'Fredoka',sans-serif; }

  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 22px; }
  .brand{ font-size:20px; font-weight:700; color:var(--yellow); }
  .brand span{ color:var(--mint); }
  .status{ font-size:13px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-dim); }
  .dot.live{ background:var(--mint); box-shadow:0 0 8px var(--mint); }
  .dot.test{ background:var(--yellow); box-shadow:0 0 8px var(--yellow); }

  .layout{ flex:1; display:flex; gap:16px; padding:0 22px 20px; min-height:0; }
  .stage{ flex:2; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; }
  .side{ flex:1; max-width:340px; display:flex; flex-direction:column; gap:14px; min-height:0; }

  .scrambled{
    font-size:clamp(28px, 6vw, 64px); letter-spacing:10px; color:var(--yellow);
    text-shadow:0 0 24px rgba(255,210,63,.35); margin-bottom:18px; text-align:center;
  }
  .word-display{
    font-size:clamp(28px, 5vw, 52px); letter-spacing:14px; color:var(--ink);
    background:var(--panel2); border:1px solid var(--line); border-radius:18px;
    padding:16px 30px; text-align:center; min-width:60%;
  }
  .instructions{ margin-top:18px; color:var(--ink-dim); font-size:15px; text-align:center; }
  .instructions b{ color:var(--mint); }

  .timer-wrap{ display:flex; align-items:center; gap:12px; margin-top:22px; width:70%; max-width:420px; }
  .timer-bar-track{ flex:1; height:10px; background:var(--panel2); border-radius:8px; overflow:hidden; }
  .timer-bar-fill{ height:100%; background:var(--mint); transition:width 1s linear; }
  .timer-num{ font-size:20px; color:var(--ink); width:34px; text-align:right; }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px;
    display:flex; flex-direction:column; min-height:0;
  }
  .panel h2{ font-size:14px; margin:0 0 8px; color:var(--ink-dim); font-weight:600; text-transform:none; }

  .leaderboard{ flex:1; overflow:hidden; }
  .leader-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .leader-row:last-child{ border-bottom:none; }
  .leader-rank{ color:var(--yellow); font-weight:700; width:26px; display:inline-block; }

  .feed{ flex:2; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:6px; font-size:14px; }
  .feed-item{ line-height:1.4; }
  .feed-item .u{ color:var(--mint); font-weight:600; }
  .feed-item.win{ color:var(--yellow); font-weight:600; }
  .feed-item.system{ color:var(--ink-dim); font-style:italic; }
  .feed-item.host .u{ color:var(--pink); }

  @media (max-width: 780px){
    .layout{ flex-direction:column; }
    .side{ max-width:none; flex-direction:row; }
    .panel{ flex:1; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Word<span>Salad</span> Live</div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>
  </div>

  <div class="layout">
    <div class="stage">
      <div class="scrambled" id="scrambledWord">— waiting for host to start —</div>
      <div class="word-display" id="wordDisplay">&nbsp;</div>
      <div class="timer-wrap">
        <div class="timer-bar-track"><div class="timer-bar-fill" id="timerFill" style="width:100%;"></div></div>
        <div class="timer-num" id="timerNum">--</div>
      </div>
      <div class="instructions">Type your guess in the <b>TikTok LIVE comments</b> to play!</div>
    </div>

    <div class="side">
      <div class="panel leaderboard">
        <h2>Top 10</h2>
        <div id="leaderboard"><div style="color:var(--ink-dim); font-size:14px;">No scores yet — be the first!</div></div>
      </div>
      <div class="panel feed">
        <h2 style="padding:0 0 4px;">Live Comments</h2>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  function setVH(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
  setVH();

  const socket = io();

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  socket.on('state', (s) => {
    const dot = document.getElementById('statusDot');
    dot.className = 'dot ' + (s.connection.mode === 'live' ? 'live' : s.connection.mode === 'test' ? 'test' : '');
    document.getElementById('statusText').textContent =
      s.connection.mode === 'live' ? 'LIVE — reading @' + s.connection.tiktokUsername :
      s.connection.mode === 'test' ? 'Test Mode' : 'Waiting to connect';

    document.getElementById('scrambledWord').textContent =
      s.game.scrambled ? s.game.scrambled.toUpperCase() : '— waiting for host to start —';
    document.getElementById('wordDisplay').textContent = s.game.display ? s.game.display.toUpperCase() : '\u00A0';

    const pct = s.game.timeLimitSeconds ? Math.max(0, (s.game.timeLeft / s.game.timeLimitSeconds) * 100) : 100;
    document.getElementById('timerFill').style.width = pct + '%';
    document.getElementById('timerNum').textContent = s.game.status === 'playing' ? s.game.timeLeft + 's' : '--';

    const lb = document.getElementById('leaderboard');
    if (!s.leaderboard.length) {
      lb.innerHTML = '<div style="color:var(--ink-dim); font-size:14px;">No scores yet — be the first!</div>';
    } else {
      lb.innerHTML = s.leaderboard.map((row, i) =>
        `<div class="leader-row"><span><span class="leader-rank">#${i+1}</span>${escapeHtml(row.name)}</span><span>${row.score}</span></div>`
      ).join('');
    }

    const feed = document.getElementById('feed');
    feed.innerHTML = s.feed.slice(0, 25).map(item => {
      if (item.type === 'system') return `<div class="feed-item system">${escapeHtml(item.text)}</div>`;
      if (item.type === 'win') return `<div class="feed-item win">${escapeHtml(item.text)}</div>`;
      if (item.type === 'host') return `<div class="feed-item host"><span class="u">HOST:</span> ${escapeHtml(item.text)}</div>`;
      return `<div class="feed-item"><span class="u">${escapeHtml(item.user)}:</span> ${escapeHtml(item.text)}</div>`;
    }).join('');
  });
</script>
</body>
</html>
